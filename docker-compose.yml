services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaef
      POSTGRES_PASSWORD: kaef
      POSTGRES_DB: kaef_menu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaef -d kaef_menu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
